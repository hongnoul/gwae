# cargo-deny configuration: licenses + advisories.
# Verify with: cargo deny check (installed via `cargo install cargo-deny`).

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# strimux is MIT; every dependency must be compatible.
allow = [
    "MIT",
    "ISC",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
unlicensed = "deny"
allow-osi-fsf-free = "neither"
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
