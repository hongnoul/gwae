name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / clippy / fmt / test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check
        run: cargo check --workspace
      - name: test
        run: cargo test --workspace

  windows:
    # Windows is a launch-differentiating claim (the whole tmux-based competing
    # tier is Unix-only), so the build must not be allowed to rot. Runtime
    # ConPTY behaviour is still verified by hand in M3; this job only guarantees
    # the tree keeps compiling for the MSVC target.
    name: windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
