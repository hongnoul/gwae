name: CI

# macOS is the primary platform; Linux and Windows ship binaries via the
# installer scripts, so all three compile and test here.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / clippy / fmt / test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check
        run: cargo check --workspace
      - name: test
        run: cargo test --workspace
