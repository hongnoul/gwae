# Manual growth snapshot + geo check, committed back to the repo so
# .astrophile/snapshots.jsonl remains an on-demand trend log.
name: astrophile snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install astrophile
        run: cargo install --git https://github.com/hongnoul/astrophile --locked
      - name: Snapshot + geo + audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          astrophile snapshot
          astrophile geo || true
          astrophile audit
      - name: Commit trend log
        run: |
          git config user.name 'astrophile-bot'
          git config user.email 'actions@github.com'
          git add -f .astrophile/snapshots.jsonl
          git diff --cached --quiet || git commit -m 'astrophile: snapshot'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
