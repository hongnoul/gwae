name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

  build:
    name: build (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Asset names carry no version so that the
      # /releases/latest/download/<asset> redirect (used by scripts/install.sh)
      # stays stable; the tag directory in the URL pins the version.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf gwae-${{ matrix.target }}.tar.gz gwae
          shasum -a 256 gwae-${{ matrix.target }}.tar.gz > gwae-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a gwae-${{ matrix.target }}.zip gwae.exe
          (Get-FileHash gwae-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  gwae-${{ matrix.target }}.zip" | Out-File -Encoding ascii gwae-${{ matrix.target }}.zip.sha256
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            target/${{ matrix.target }}/release/gwae-${{ matrix.target }}.* \
            --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  # ── After the GitHub Release is live: bump every downstream channel.
  # Each job is gated on its secret so a missing PAT/token just skips with a warning.
  # The only human step is provisioning secrets once (and creating the scoop-bucket repo once).

  cargo-publish:
    name: cargo publish
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check for registry token
        id: has_token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping cargo publish (manual: add trusted publisher or set secret)"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish crates (dependency order)
        if: steps.has_token.outputs.has == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Workspace version is bumped before tagging; crates inherit it.
          # Publish in dependency order so each sees its deps on crates.io.
          for crate in gwae-layout gwae-term gwae-testkit gwae; do
            echo "::group::cargo publish -p $crate"
            # Retry once for crates.io propagation lag.
            cargo publish -p "$crate" --locked || {
              echo "retry in 20s..."
              sleep 20
              cargo publish -p "$crate" --locked
            }
            echo "::endgroup::"
            sleep 5
          done

  bump-tap:
    name: bump-tap (hongnoul/homebrew-tap)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for TAP_PAT
        id: has_pat
        env:
          PAT: ${{ secrets.TAP_PAT }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_PAT not set — skipping Homebrew tap bump. Set with: gh secret set TAP_PAT --body <PAT: repo+workflow> --repo hongnoul/gwae"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump tap
        if: steps.has_pat.outputs.has == 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPO="hongnoul/gwae"
          echo "bump-tap: $TAG -> $VERSION"

          fetch_sha() {
            local asset="$1"
            local url="https://github.com/${REPO}/releases/download/${TAG}/${asset}.sha256"
            echo "  fetching $url"
            # Prefer curl via releases/download (no API rate limit); fall back to gh.
            if curl -fsSL "$url" -o /tmp/_sha 2>/dev/null; then
              awk '{print $1}' /tmp/_sha
            else
              echo "  curl failed, trying gh release download..."
              gh release download "$TAG" -p "${asset}.sha256" -D /tmp 2>/dev/null || true
              awk '{print $1}' /tmp/"${asset}.sha256" 2>/dev/null || {
                echo "::error::could not fetch SHA for $asset"
                exit 1
              }
            fi
          }

          SHA_ARM_MAC=$(fetch_sha "gwae-aarch64-apple-darwin.tar.gz")
          SHA_X64_MAC=$(fetch_sha "gwae-x86_64-apple-darwin.tar.gz")
          SHA_X64_LINUX=$(fetch_sha "gwae-x86_64-unknown-linux-musl.tar.gz")
          SHA_ARM_LINUX=$(fetch_sha "gwae-aarch64-unknown-linux-musl.tar.gz")
          echo "SHAs: arm_mac=$SHA_ARM_MAC x64_mac=$SHA_X64_MAC x64_linux=$SHA_X64_LINUX arm_linux=$SHA_ARM_LINUX"

          # --- push to tap repo ---
          TMP=$(mktemp -d)
          git clone "https://x-access-token:${TAP_PAT}@github.com/hongnoul/homebrew-tap.git" "$TMP/tap"
          cat > "$TMP/tap/Formula/gwae.rb" <<RUBY
          # Homebrew formula for the tap hongnoul/homebrew-tap, so the user-facing
          # command is \`brew install hongnoul/tap/gwae\`.
          #
          # This file is generated by gwae's release workflow (bump-tap job).
          # Do not edit the SHA/version lines by hand — edit packaging/homebrew/gwae.rb in hongnoul/gwae instead.
          class Gwae < Formula
            desc "niri's scrolling tiling for your CLI agents, in any terminal"
            homepage "https://github.com/hongnoul/gwae"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM_MAC}"
              else
                url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X64_MAC}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_ARM_LINUX}"
              else
                url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X64_LINUX}"
              end
            end

            def install
              bin.install "gwae"
            end

            test do
              system "#{bin}/gwae", "doctor"
            end
          end
          RUBY
          cd "$TMP/tap"
          git config user.name "gwae-bot"
          git config user.email "gwae-bot@hongnoul.github.io"
          git add Formula/gwae.rb
          if git diff --cached --quiet; then
            echo "tap already at $VERSION, nothing to commit"
          else
            git commit -m "gwae ${VERSION}"
            git push
            echo "pushed hongnoul/homebrew-tap@${VERSION}"
          fi

          # --- also patch the source-of-truth copy in this repo so next checkout is not stale ---
          # Push directly to main with GITHUB_TOKEN (no PR needed — this is machine bookkeeping).
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$TMP/gwae"
          cd "$TMP/gwae"
          git fetch origin main --depth=1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.name "gwae-bot"
          git config user.email "gwae-bot@hongnoul.github.io"
          # Overwrite packaging file with the same generated content
          cp "$TMP/tap/Formula/gwae.rb" packaging/homebrew/gwae.rb
          # Also sync scoop manifest + PKGBUILD SHAs while we are here
          if [ -f packaging/scoop/gwae.json ]; then
            python3 -c "
          import json, pathlib
          p = pathlib.Path('packaging/scoop/gwae.json')
          j = json.loads(p.read_text())
          j['version'] = '${VERSION}'
          j['architecture']['64bit']['url'] = 'https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-x86_64-pc-windows-msvc.zip'
          # hash refreshed by bump-scoop job; keep if already set, else fetch
          p.write_text(json.dumps(j, indent=2) + '\n')
          "
          fi
          # PKGBUILD (gwae-bin) — update pkgver + sha256sums_* if file exists
          if [ -f packaging/aur/PKGBUILD ]; then
            sed -i.bak -E "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
            sed -i.bak -E "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X64_LINUX}')/" packaging/aur/PKGBUILD
            sed -i.bak -E "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM_LINUX}')/" packaging/aur/PKGBUILD
            rm -f packaging/aur/PKGBUILD.bak
          fi
          # Mirror installers to docs/ so Pages serves them
          if [ -f scripts/install.sh ]; then cp scripts/install.sh docs/install.sh; fi
          if [ -f scripts/install.ps1 ]; then cp scripts/install.ps1 docs/install.ps1; fi
          git add packaging/homebrew/gwae.rb packaging/scoop/gwae.json packaging/aur/PKGBUILD docs/install.sh docs/install.ps1 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "gwae main already up to date"
          else
            git commit -m "release: sync formulae + Pages installers to v${VERSION} [skip ci]"
            git push origin main
            echo "synced packaging + docs to main@${VERSION}"
          fi

  bump-scoop:
    name: bump-scoop (hongnoul/scoop-bucket)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for TAP_PAT (same PAT covers scoop-bucket)
        id: has_pat
        env:
          PAT: ${{ secrets.TAP_PAT }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_PAT not set — skipping scoop bump (shares PAT with tap)"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump scoop bucket
        if: steps.has_pat.outputs.has == 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPO="hongnoul/gwae"
          ASSET="gwae-x86_64-pc-windows-msvc.zip"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
          SHA_URL="${URL}.sha256"
          echo "bump-scoop: $TAG"
          TMP=$(mktemp -d)

          # Fetch Windows zip SHA
          if curl -fsSL "$SHA_URL" -o /tmp/win.sha 2>/dev/null; then
            HASH=$(awk '{print $1}' /tmp/win.sha)
          else
            gh release download "$TAG" -p "${ASSET}.sha256" -D /tmp || true
            HASH=$(awk '{print $1}' /tmp/"${ASSET}.sha256" 2>/dev/null || echo "")
          fi
          if [ -z "${HASH:-}" ]; then
            echo "::warning::could not fetch Windows SHA — skipping scoop (release may still be replicating)"
            exit 0
          fi
          echo "windows hash $HASH"

          # If bucket repo does not exist yet, create it via GH_TOKEN (requires repo scope, which we have).
          if ! gh repo view hongnoul/scoop-bucket >/dev/null 2>&1; then
            echo "scoop-bucket not found — creating hongnoul/scoop-bucket"
            if gh repo create hongnoul/scoop-bucket --public --description "Scoop bucket for gwae" >/dev/null 2>&1; then
              sleep 3
            else
              echo "::warning::could not create scoop-bucket (needs repo scope) — skipping"
              exit 0
            fi
          fi

          git clone "https://x-access-token:${TAP_PAT}@github.com/hongnoul/scoop-bucket.git" "$TMP/bucket"
          mkdir -p "$TMP/bucket/bucket"
          # Use committed manifest as template if present, else generate.
          if [ -f "$TMP/bucket/bucket/gwae.json" ]; then
            SRC="$TMP/bucket/bucket/gwae.json"
          else
            SRC="packaging/scoop/gwae.json"
            if [ ! -f "$SRC" ]; then
              echo "::error::no scoop template at packaging/scoop/gwae.json"
              exit 1
            fi
            cp "$SRC" "$TMP/bucket/bucket/gwae.json"
          fi
          python3 -c "
          import json, pathlib
          p = pathlib.Path('$TMP/bucket/bucket/gwae.json')
          j = json.loads(p.read_text())
          j['version'] = '${VERSION}'
          j['architecture']['64bit']['url'] = '${URL}'
          j['architecture']['64bit']['hash'] = '${HASH}'
          # keep autoupdate templated
          j.setdefault('autoupdate', {})['architecture'] = {'64bit': {'url': 'https://github.com/hongnoul/gwae/releases/download/v\$version/gwae-x86_64-pc-windows-msvc.zip'}}
          j['autoupdate']['hash'] = {'url': 'https://github.com/hongnoul/gwae/releases/download/v\$version/gwae-x86_64-pc-windows-msvc.zip.sha256'}
          p.write_text(json.dumps(j, indent=2) + '\n')
          "
          cd "$TMP/bucket"
          git config user.name "gwae-bot"
          git config user.email "gwae-bot@hongnoul.github.io"
          git add bucket/gwae.json
          if git diff --cached --quiet; then
            echo "scoop already at $VERSION"
          else
            # Ensure README exists (Scoop buckets without README look abandoned)
            if [ ! -f README.md ]; then
              echo '# scoop-bucket — gwae' > README.md
              echo 'Scoop bucket for [gwae](https://github.com/hongnoul/gwae).' >> README.md
              echo '' >> README.md
              echo '```powershell' >> README.md
              echo 'scoop bucket add gwae https://github.com/hongnoul/scoop-bucket' >> README.md
              echo 'scoop install gwae' >> README.md
              echo '```' >> README.md
              git add README.md
            fi
            git commit -m "gwae ${VERSION}"
            git push
            echo "pushed scoop-bucket@${VERSION}"
          fi
