name: Release

# Homebrew is the absolute source of truth for deployments.
# Tagging `v*` builds the two macOS bottles, publishes the GitHub Release,
# and bumps the tap. Nothing else ships from this repo.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: scripts/generate_release_notes.sh "${GITHUB_REF_NAME}" > release_notes.md

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md

  build:
    name: build (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Asset names carry no version so that the
      # /releases/latest/download/<asset> redirect stays stable;
      # the tag directory in the URL pins the version.
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf gwae-${{ matrix.target }}.tar.gz gwae
          shasum -a 256 gwae-${{ matrix.target }}.tar.gz > gwae-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            target/${{ matrix.target }}/release/gwae-${{ matrix.target }}.* \
            --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

  # ── After the GitHub Release is live: bump the Homebrew tap.
  # Gated on TAP_PAT so a missing secret skips with a warning.
  # The only human step is provisioning the secret once.

  bump-tap:
    name: bump-tap (hongnoul/homebrew-tap)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for TAP_PAT
        id: has_pat
        env:
          PAT: ${{ secrets.TAP_PAT }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_PAT not set — skipping Homebrew tap bump. Set with: gh secret set TAP_PAT --body <PAT: repo+workflow> --repo hongnoul/gwae"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump tap
        if: steps.has_pat.outputs.has == 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPO="hongnoul/gwae"
          echo "bump-tap: $TAG -> $VERSION"

          fetch_sha() {
            local asset="$1"
            local url="https://github.com/${REPO}/releases/download/${TAG}/${asset}.sha256"
            echo "  fetching $url" >&2
            # Prefer curl via releases/download (no API rate limit); fall back to gh.
            if curl -fsSL "$url" -o /tmp/_sha 2>/dev/null; then
              awk '{print $1}' /tmp/_sha
            else
              echo "  curl failed, trying gh release download..." >&2
              gh release download "$TAG" -p "${asset}.sha256" -D /tmp 2>/dev/null || true
              awk '{print $1}' /tmp/"${asset}.sha256" 2>/dev/null || {
                echo "::error::could not fetch SHA for $asset"
                exit 1
              }
            fi
          }

          SHA_ARM_MAC=$(fetch_sha "gwae-aarch64-apple-darwin.tar.gz")
          SHA_X64_MAC=$(fetch_sha "gwae-x86_64-apple-darwin.tar.gz")
          echo "SHAs: arm_mac=$SHA_ARM_MAC x64_mac=$SHA_X64_MAC"

          # Guard: a captured log line or partial download must never reach the formula.
          for sha in "$SHA_ARM_MAC" "$SHA_X64_MAC"; do
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::malformed sha256: '$sha'"
              exit 1
            fi
          done

          # --- push to tap repo ---
          TMP=$(mktemp -d)
          git clone "https://x-access-token:${TAP_PAT}@github.com/hongnoul/homebrew-tap.git" "$TMP/tap"
          cat > "$TMP/tap/Formula/gwae.rb" <<RUBY
          # Homebrew formula for the tap hongnoul/homebrew-tap, so the user-facing
          # command is \`brew install hongnoul/tap/gwae\`.
          #
          # This file is generated by gwae's release workflow (bump-tap job).
          # Do not edit the SHA/version lines by hand — edit packaging/homebrew/gwae.rb in hongnoul/gwae instead.
          class Gwae < Formula
            desc "Scrolling terminal multiplexer for macOS; panes never shrink"
            homepage "https://github.com/hongnoul/gwae"
            license "MIT"

            if Hardware::CPU.arm?
              url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-aarch64-apple-darwin.tar.gz"
              sha256 "${SHA_ARM_MAC}"
            else
              url "https://github.com/hongnoul/gwae/releases/download/v${VERSION}/gwae-x86_64-apple-darwin.tar.gz"
              sha256 "${SHA_X64_MAC}"
            end

            def install
              bin.install "gwae"
            end

            def caveats
              <<~EOS
                ▄▄▄▄ ▄ ▄
                 ▄ █ █▄█   welcome to gwae — panes that never shrink.
                 █ █ █ █   installed and on your PATH, nothing to configure.
                 █ ▀ █ █   type `gwae` and you're in.
                ▀▀▀▀ ▀ ▀
              EOS
            end

            test do
              system "#{bin}/gwae", "doctor"
            end
          end
          RUBY
          cd "$TMP/tap"
          git config user.name "gwae-bot"
          git config user.email "gwae-bot@hongnoul.github.io"
          git add Formula/gwae.rb
          if git diff --cached --quiet; then
            echo "tap already at $VERSION, nothing to commit"
          else
            git commit -m "gwae ${VERSION}"
            git push
            echo "pushed hongnoul/homebrew-tap@${VERSION}"
          fi

          # --- also patch the source-of-truth copy in this repo so next checkout is not stale ---
          # Push directly to main with TAP_PAT (no PR needed — this is machine
          # bookkeeping): main's required status checks reject the workflow's
          # own github.token, while the admin PAT is allowed to bypass them.
          # Mirror scripts/install.sh to docs/install.sh so Pages serves the
          # curl URL (https://hongnoul.github.io/gwae/install.sh). The docs
          # copy is generated: edit scripts/install.sh, never docs/install.sh.
          git clone "https://x-access-token:${TAP_PAT}@github.com/${REPO}.git" "$TMP/gwae"
          cd "$TMP/gwae"
          git fetch origin main --depth=1 || true
          git checkout -B main origin/main 2>/dev/null || git checkout -B main
          git config user.name "gwae-bot"
          git config user.email "gwae-bot@hongnoul.github.io"
          # Overwrite packaging file with the same generated content
          cp "$TMP/tap/Formula/gwae.rb" packaging/homebrew/gwae.rb
          if [ -f scripts/install.sh ]; then cp scripts/install.sh docs/install.sh; fi
          git add packaging/homebrew/gwae.rb docs/install.sh 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "gwae main already up to date"
          else
            git commit -m "release: sync Homebrew formula + Pages installer to v${VERSION} [skip ci]"
            git push origin main
            echo "synced formula + installer to main@${VERSION}"
          fi
