name: Feature request
description: Propose a feature. Please name the milestone/non-goal it touches.
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What do you want, and why?
    validations:
      required: true
  - type: textarea
    id: milestone
    attributes:
      label: Where does this fit?
      description: Which milestone (docs/ROADMAP.md) or non-goal does this touch? If it is a layout change, it needs a docs/LAYOUT-SPEC.md PR first.
      placeholder: "e.g. M2 agent ergonomics, or: this is a non-goal (daemon)"
    validations:
      required: true
