[package]
name = "gwae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gwae: a terminal-native, daemon-free multiplexer for CLI agents (niri strip in any terminal)"
keywords = ["terminal", "multiplexer", "tiling", "cli-agents", "tui"]
categories = ["command-line-utilities"]
default-run = "gwae"

[[bin]]
name = "gwae"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gwae-layout = { path = "../gwae-layout" }
gwae-term = { path = "../gwae-term" }
gwae-testkit = { path = "../gwae-testkit" }
portable-pty = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
