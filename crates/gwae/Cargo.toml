[package]
name = "gwae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gwae: a terminal-native, daemon-free multiplexer for CLI agents (niri strip in any terminal)"
homepage = "https://hongnoul.github.io/gwae/"
documentation = "https://github.com/hongnoul/gwae/tree/main/docs"
keywords = ["terminal", "multiplexer", "tiling", "cli-agents", "tui"]
categories = ["command-line-utilities"]
default-run = "gwae"

[[bin]]
name = "gwae"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
# Hot-reload handover only: `Layout` keys panes by integer id, which TOML
# cannot represent. Already in the tree via gwae-layout's round-trip tests.
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gwae-layout = { path = "../gwae-layout", version = "1.0.0" }
gwae-term = { path = "../gwae-term", version = "1.0.0" }
gwae-testkit = { path = "../gwae-testkit", version = "1.0.0" }
portable-pty = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
