[package]
name = "strimux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "strimux: a terminal-native, daemon-free multiplexer for CLI agents (niri strip in any terminal)"
default-run = "strimux"

[[bin]]
name = "strimux"
path = "src/main.rs"

[[bin]]
name = "strimux-hmr"
path = "src/bin/hmr.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
strimux-layout = { path = "../strimux-layout" }
strimux-term = { path = "../strimux-term" }
strimux-testkit = { path = "../strimux-testkit" }
strimux-core-api = { path = "../strimux-core-api" }
portable-pty = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
libloading = { workspace = true }
