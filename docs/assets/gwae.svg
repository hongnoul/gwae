<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="1024" height="1024" role="img" aria-label="gwae">
  <title>gwae</title>
  <!-- gwae official mark. 8x8 module grid, 1-module margin, bar weight = 1 module. -->
  <rect x="0" y="0" width="10" height="10" fill="#fff"/>
  <path fill="#000" d="
    M1,1 h4 v1 h-4 z
    M4,1 h1 v6 h-1 z
    M2,3 h1 v6 h-1 z
    M1,8 h4 v1 h-4 z
    M6,1 h1 v8 h-1 z
    M6,3 h3 v1 h-3 z
    M8,1 h1 v8 h-1 z"/>
</svg>
